plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.mitsuru'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-freemarker'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-freemarker-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
	// always re-run tests so the log events are printed every time
	outputs.upToDateWhen { false }
	testLogging {
		events = ["started", "passed", "failed", "skipped", "standard_out", "standard_error"]
		exceptionFormat = "full"
		showStandardStreams = true
	}
	addTestListener(new TestListener() {
		void beforeSuite(TestDescriptor suite) {}
		void beforeTest(TestDescriptor test) {}
		void afterTest(TestDescriptor test, TestResult result) {}
		void afterSuite(TestDescriptor suite, TestResult result) {
			if (!suite.parent) {
				println "Results: ${result.resultType} (${result.testCount} tests, ${result.successfulTestCount} passed, ${result.failedTestCount} failed, ${result.skippedTestCount} skipped)"
			}
		}
	})
}
