plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.mitsuru'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-freemarker'
	// JDBC drivers used to read table definitions (versions come from Spring Boot)
	runtimeOnly 'com.oracle.database.jdbc:ojdbc11'
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'com.mysql:mysql-connector-j'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-freemarker-test'
	// in-memory DB that imitates Oracle / PostgreSQL / MySQL in tests
	testRuntimeOnly 'com.h2database:h2'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

// Mockito's agent, loaded at JVM start (dynamic loading prints a warning on Java 21+)
configurations {
	mockitoAgent
}
dependencies {
	mockitoAgent('org.mockito:mockito-core') { transitive = false }
}

// Copy the JDBC drivers into lib/ so gen.sh / gen.bat can use them
tasks.register('copyDrivers', Copy) {
	from(configurations.runtimeClasspath) {
		include 'ojdbc*.jar', 'postgresql-*.jar', 'mysql-connector-j-*.jar'
	}
	into 'lib'
}

// Copy test libraries into lib/: H2 (in-memory test DB) and Mockito with its dependencies
tasks.register('copyTestLibs', Copy) {
	from(configurations.testRuntimeClasspath) {
		include 'h2-*.jar', 'mockito-*.jar', 'byte-buddy-*.jar', 'objenesis-*.jar'
	}
	into 'lib'
}

tasks.named('test') {
	useJUnitPlatform()
	jvmArgs "-javaagent:${configurations.mockitoAgent.asPath}"
	// always re-run tests so the log events are printed every time
	outputs.upToDateWhen { false }
	testLogging {
		events = ["started", "passed", "failed", "skipped", "standard_out", "standard_error"]
		exceptionFormat = "full"
		showStandardStreams = true
	}
	addTestListener(new TestListener() {
		void beforeSuite(TestDescriptor suite) {}
		void beforeTest(TestDescriptor test) {}
		void afterTest(TestDescriptor test, TestResult result) {}
		void afterSuite(TestDescriptor suite, TestResult result) {
			if (!suite.parent) {
				println "Results: ${result.resultType} (${result.testCount} tests, ${result.successfulTestCount} passed, ${result.failedTestCount} failed, ${result.skippedTestCount} skipped)"
			}
		}
	})
}
