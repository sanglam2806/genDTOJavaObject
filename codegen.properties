# Which database to read table definitions from: oracle | postgres | mysql
# (can be overridden with --db=...)
db=postgres

# Generated code
package=com.mitsuru.gen
out=src/main/java

# ---- Oracle ----
oracle.url=jdbc:oracle:thin:@localhost:1521/XEPDB1
oracle.user=system
oracle.password=
# optional, default = the login user's schema
oracle.schema=

# ---- PostgreSQL ----
postgres.url=jdbc:postgresql://localhost:5432/postgres
postgres.user=postgres
postgres.password=
# optional, default = current schema (usually public)
postgres.schema=

# ---- MySQL ----
# the database name in the URL is used as the catalog
mysql.url=jdbc:mysql://localhost:3306/test
mysql.user=root
mysql.password=
